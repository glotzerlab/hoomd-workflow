[package]
name = "hoomd-workflow"
edition = "2024"
publish = false

[dependencies]
hoomd-geometry = "1.2.0"
hoomd-gsd = "1.2.0"
hoomd-interaction = "1.2.0"
hoomd-mc = "1.2.0"
hoomd-md = "1.2.0"
hoomd-microstate = "1.2.0"
hoomd-simulation = "1.2.0"
hoomd-spatial = "1.2.0"
hoomd-utility = "1.2.0"
hoomd-vector = "1.2.0"

anyhow = "1.0.100"
clap = {version = "4.5.48", features = ["derive"]}
clap-verbosity-flag = "3.0.3"
env_logger = "0.11.8"
log = "0.4.28"
postcard = {version = "1.1.3", default-features = false, features = ["use-std"]}
parquet = { version = "59.0.0", default-features=false }
parquet_derive = { version = "59.0.0", default-features=false }
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
